<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | AL ANKABOOT SPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,sans-serif;background:#06080e;color:#e9eef8;min-height:100vh;
  background:radial-gradient(1000px 500px at 85% -10%,#1b2436,transparent 60%),
             radial-gradient(800px 400px at -10% 110%,#241b06,transparent 55%),#06080e;
  user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:400px;background:#0c121d;border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:32px 26px;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.7)}
.lico{width:80px;height:80px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
  font-size:34px;background:linear-gradient(145deg,#f2c14e,#a8791a);box-shadow:0 16px 40px rgba(242,193,78,.4)}
.lbox h2{font-size:20px;font-weight:900;margin-bottom:6px}
.lbox>p{font-size:12.5px;color:#8695ac;margin-bottom:22px}
.f{margin-bottom:14px;text-align:right}
.f label{display:block;font-size:12px;font-weight:700;color:#b9c4d6;margin-bottom:6px}
.f input,.f select{width:100%;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);color:#e9eef8;font-size:14px;outline:none}
.f input:focus{border-color:#f2c14e}
#loginBtn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:800;
  background:linear-gradient(145deg,#f2c14e,#c9922c);color:#1a1206;margin-top:6px}
#errMsg{display:none;margin-top:14px;padding:12px;border-radius:11px;background:rgba(255,77,94,.15);
  border:1px solid rgba(255,77,94,.4);color:#ff8a95;font-size:12.5px;font-weight:700;text-align:right}
#panel{display:none;padding:20px;max-width:1100px;margin:0 auto;padding-bottom:60px}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;
  padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07)}
.phead h2{font-size:19px;font-weight:900}
.logout{padding:9px 16px;border-radius:10px;background:rgba(255,77,94,.15);color:#ff8a95;
  font-size:13px;font-weight:700}
.card{background:rgba(20,29,46,.6);border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:18px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px}
.inrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inrow .f{flex:1;min-width:170px;margin:0}
.btn-gold{padding:12px 20px;border-radius:11px;background:linear-gradient(145deg,#f2c14e,#c9922c);
  color:#1a1206;font-weight:800;font-size:13px}
.btn-ghost{padding:12px 20px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);color:#e9eef8;font-weight:700;font-size:13px}
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto}
.item{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:13.5px;font-weight:700}
.item .info small{display:block;font-size:10.5px;color:#8695ac;direction:ltr;text-align:right;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{padding:8px 12px;border-radius:9px;background:rgba(255,77,94,.15);color:#ff8a95;
  font-size:12px;font-weight:700;flex-shrink:0}
.empty{text-align:center;padding:20px;font-size:12.5px;color:#8695ac}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  padding:12px 22px;border-radius:12px;background:#1a2436;border:1px solid #f2c14e;
  color:#e9eef8;font-size:13px;font-weight:700;z-index:500;transition:.35s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.status{position:fixed;top:12px;left:12px;padding:6px 12px;border-radius:8px;
  font-size:11px;font-weight:700;background:rgba(40,199,111,.2);color:#5be89a;z-index:999}
.status.err{background:rgba(255,77,94,.2);color:#ff8a95}
.status.wait{background:rgba(242,193,78,.2);color:#f2c14e}
.tip{font-size:11px;color:#8695ac;margin-top:6px;line-height:1.6}
.tip b{color:#f2c14e}
</style>
</head>
<body>

<div class="status wait" id="cloudStatus">☁️ جاري الاتصال...</div>

<div id="loginScreen">
  <div class="lbox">
    <div class="lico">🔐</div>
    <h2>لوحة تحكم الأدمن</h2>
    <p>هذه الصفحة مخصصة لمدير الموقع فقط</p>
    <div class="f">
      <label>اسم المستخدم</label>
      <input type="text" id="uInput" placeholder="أدخل اسم المستخدم" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="f">
      <label>كلمة المرور</label>
      <input type="password" id="pInput" placeholder="أدخل كلمة المرور" autocomplete="off">
    </div>
    <button type="button" id="loginBtn" onclick="window.__doLogin()">🔓 دخول</button>
    <div id="errMsg"></div>
  </div>
</div>

<div id="panel">
  <div class="phead">
    <h2>⚙️ إدارة الموقع</h2>
    <button type="button" class="logout" onclick="window.__logout()">خروج</button>
  </div>

  <div class="card">
    <h3>📁 الأقسام</h3>
    <div class="inrow">
      <div class="f"><label>اسم القسم</label><input type="text" id="catName" placeholder="مثال: beIN SPORTS"></div>
      <div class="f"><label>لوجو (اختياري)</label><input type="text" id="catLogo" placeholder="https://..." style="direction:ltr;text-align:left"></div>
      <button type="button" class="btn-gold" onclick="window.__addCat()">➕ إضافة</button>
    </div>
    <div class="list" id="catsList"></div>
  </div>

  <div class="card">
    <h3>📺 القنوات</h3>
    <div class="f"><label>القسم</label><select id="chCat"></select></div>
    <div class="inrow">
      <div class="f"><label>اسم القناة</label><input type="text" id="chName" placeholder="beIN 1"></div>
      <div class="f"><label>لوجو (اختياري)</label><input type="text" id="chLogo" placeholder="https://..." style="direction:ltr;text-align:left"></div>
    </div>
    <div class="f" style="margin-top:10px">
      <label>رابط البث (m3u8 أو iframe)</label>
      <input type="text" id="chUrl" placeholder="http://example.com/stream.m3u8" style="direction:ltr;text-align:left">
      <div class="tip">⚠️ حط الرابط الأصلي فقط — بدون أي إضافات</div>
    </div>
    <button type="button" class="btn-gold" style="width:100%;margin-top:8px" onclick="window.__addChan()">➕ إضافة القناة</button>
    <div class="list" id="chansList"></div>
  </div>

  <div class="card">
    <h3>🔗 تيليجرام</h3>
    <div class="f"><label>الرابط</label><input type="text" id="tgUrl" style="direction:ltr;text-align:left"></div>
    <button type="button" class="btn-gold" style="width:100%;margin-top:8px" onclick="window.__saveTg()">💾 حفظ</button>
  </div>

  <div class="card">
    <h3>🔑 بيانات الدخول</h3>
    <div class="inrow">
      <div class="f"><label>اسم مستخدم جديد</label><input type="text" id="newUser" placeholder="اتركه فاضي"></div>
      <div class="f"><label>كلمة مرور جديدة</label><input type="text" id="newPass" placeholder="اتركها فاضية"></div>
    </div>
    <button type="button" class="btn-ghost" style="width:100%;margin-top:10px" onclick="window.__changeCreds()">🔑 تحديث</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var PANTRY_ID = '5dd567ce-5bb7-46a4-8005-d022dd892f32';
  var BASKET    = 'ankaboot_data';
  var DEFAULT_USER = 'FF';
  var DEFAULT_PASS = 'FFFF';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var state = { telegram:'https://t.me/alankabootsport', username:DEFAULT_USER, password:DEFAULT_PASS, categories:[] };

  function setCloudStatus(cls, text){
    var el = $('cloudStatus');
    el.textContent = text;
    el.className = 'status ' + cls;
  }

  async function loadFromCloud(){
    try{
      var res = await fetch('https://getpantry.cloud/apiv1/pantry/' + PANTRY_ID + '/basket/' + BASKET + '?t=' + Date.now());
      if(res.status === 400 || res.status === 404) return null;
      if(!res.ok) throw new Error('bad');
      return await res.json();
    }catch(e){ return null; }
  }

  async function saveToCloud(){
    try{
      var res = await fetch('https://getpantry.cloud/apiv1/pantry/' + PANTRY_ID + '/basket/' + BASKET, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      if(!res.ok) throw new Error('bad');
      setCloudStatus('', '☁️ متصل');
      return true;
    }catch(e){
      setCloudStatus('err', '❌ فشل الحفظ');
      return false;
    }
  }

  window.__doLogin = function(){
    var u = ($('uInput').value || '').trim();
    var p = $('pInput').value || '';
    var err = $('errMsg');
    var masterOk = (u === DEFAULT_USER && p === DEFAULT_PASS);
    var savedOk  = (u === state.username && p === state.password);
    if(masterOk || savedOk){
      try{ sessionStorage.setItem('ankaboot_admin_session', '1'); }catch(e){}
      showPanel();
      toast('مرحباً بك 👋');
    } else {
      err.innerHTML = '❌ بيانات الدخول غير صحيحة';
      err.style.display = 'block';
    }
  };

  window.__logout = function(){
    try{ sessionStorage.removeItem('ankaboot_admin_session'); }catch(e){}
    location.reload();
  };

  async function showPanel(){
    $('loginScreen').style.display = 'none';
    $('panel').style.display = 'block';
    setCloudStatus('wait', '☁️ جاري التحميل...');
    renderAll();

    var cloud = await loadFromCloud();
    if(cloud && cloud.categories){
      state = {
        telegram: cloud.telegram || 'https://t.me/alankabootsport',
        username: cloud.username || DEFAULT_USER,
        password: cloud.password || DEFAULT_PASS,
        categories: cloud.categories
      };
      renderAll();
      setCloudStatus('', '☁️ متصل');
      toast('تم تحميل البيانات من السحابة ☁️');
    } else {
      var ok = await saveToCloud();
      if(ok) toast('تم إنشاء السحابة ☁️');
    }
  }

  function renderAll(){
    renderCats();
    renderChans();
    renderSelects();
    $('tgUrl').value = state.telegram || '';
  }

  function renderCats(){
    var w = $('catsList');
    if(!state.categories.length){
      w.innerHTML = '<div class="empty">📭 لا توجد أقسام بعد</div>';
      return;
    }
    w.innerHTML = state.categories.map(function(c){
      return '<div class="item">'
        + '<div class="info"><b>' + esc(c.name) + '</b><small>' + (c.channels||[]).length + ' قناة</small></div>'
        + '<button type="button" class="del" onclick="window.__delCat(\'' + c.id + '\')">🗑️ حذف</button>'
      + '</div>';
    }).join('');
  }

  function renderChans(){
    var w = $('chansList');
    var html = '';
    state.categories.forEach(function(cat){
      (cat.channels||[]).forEach(function(ch){
        html += '<div class="item">'
          + '<div class="info"><b>' + esc(ch.name) + '</b><small>' + esc(ch.url) + '</small></div>'
          + '<button type="button" class="del" onclick="window.__delChan(\'' + cat.id + '\',\'' + ch.id + '\')">🗑️</button>'
        + '</div>';
      });
    });
    w.innerHTML = html || '<div class="empty">📭 لا توجد قنوات بعد</div>';
  }

  function renderSelects(){
    var sel = $('chCat');
    if(!state.categories.length){
      sel.innerHTML = '<option value="">— لا توجد أقسام —</option>';
      return;
    }
    sel.innerHTML = state.categories.map(function(c){
      return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
    }).join('');
  }

  window.__addCat = async function(){
    var name = $('catName').value.trim();
    var logo = $('catLogo').value.trim();
    if(!name) return toast('اكتب اسم القسم');
    if(state.categories.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); })){
      return toast('هذا القسم موجود');
    }
    state.categories.push({ id: uid(), name: name, logo: logo, channels: [] });
    $('catName').value = ''; $('catLogo').value = '';
    renderAll();
    toast('⏳ جاري الحفظ...');
    var ok = await saveToCloud();
    toast(ok ? 'تم إضافة القسم ✅' : '❌ فشل الحفظ');
  };

  window.__delCat = async function(id){
    var cat = state.categories.find(function(c){ return c.id === id; });
    if(!cat) return;
    if(!confirm('حذف القسم "' + cat.name + '"؟')) return;
    state.categories = state.categories.filter(function(c){ return c.id !== id; });
    renderAll();
    var ok = await saveToCloud();
    toast(ok ? 'تم الحذف 🗑️' : '❌ فشل الحفظ');
  };

  window.__addChan = async function(){
    var catId = $('chCat').value;
    var name = $('chName').value.trim();
    var url = $('chUrl').value.trim();
    var logo = $('chLogo').value.trim();
    if(!catId) return toast('أضف قسماً أولاً');
    if(!name) return toast('اكتب اسم القناة');
    if(!url) return toast('اكتب رابط البث');

    // ✅ تنظيف الرابط — لو المستخدم حط رابط مبروكس، نشيل الجزء الزيادة
    if(url.indexOf('/api/proxy?url=') !== -1){
      try{
        var m = url.match(/\/api\/proxy\?url=(.+)$/);
        if(m && m[1]) url = decodeURIComponent(m[1]);
      }catch(e){}
      toast('تم تصحيح الرابط تلقائياً ✂️');
    }

    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat) return;
    cat.channels = cat.channels || [];
    cat.channels.push({ id: uid(), name: name, url: url, logo: logo });
    $('chName').value = ''; $('chUrl').value = ''; $('chLogo').value = '';
    renderAll();
    toast('⏳ جاري الحفظ...');
    var ok = await saveToCloud();
    toast(ok ? 'تم إضافة القناة ✅' : '❌ فشل الحفظ');
  };

  window.__delChan = async function(catId, chId){
    if(!confirm('حذف هذه القناة؟')) return;
    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat) return;
    cat.channels = (cat.channels||[]).filter(function(c){ return c.id !== chId; });
    renderAll();
    var ok = await saveToCloud();
    toast(ok ? 'تم الحذف 🗑️' : '❌ فشل الحفظ');
  };

  window.__saveTg = async function(){
    var url = $('tgUrl').value.trim();
    if(!url) return toast('اكتب الرابط');
    state.telegram = url;
    var ok = await saveToCloud();
    toast(ok ? 'تم الحفظ ✅' : '❌ فشل الحفظ');
  };

  window.__changeCreds = async function(){
    var u = $('newUser').value.trim();
    var p = $('newPass').value.trim();
    if(!u && !p) return toast('اكتب حاجة جديدة');
    if(u) state.username = u;
    if(p) state.password = p;
    $('newUser').value = ''; $('newPass').value = '';
    var ok = await saveToCloud();
    toast(ok ? 'تم التحديث 🔑' : '❌ فشل الحفظ');
  };

  var tt;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  try{
    if(sessionStorage.getItem('ankaboot_admin_session') === '1') showPanel();
  }catch(e){}

  $('pInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') window.__doLogin();
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'F12'){ e.preventDefault(); return false; }
    if(e.ctrlKey && e.shiftKey && 'IJCK'.indexOf(e.key) >= 0){ e.preventDefault(); return false; }
    if(e.ctrlKey && 'uUsSpPaA'.indexOf(e.key) >= 0){ e.preventDefault(); return false; }
  }, true);

})();
</script>
</body>
</html>
